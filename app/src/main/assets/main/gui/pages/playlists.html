<div class="playlists-container">
    <header class="page-header">
        <h1 class="page-title" data-i18n="playlists.title">Playlists</h1>
        <button id="create-playlist-btn" class="btn btn--secondary btn--circle-md focusable universal-onclick" type="button" title="Create New Playlist" aria-label="Create New Playlist">
            <img src="images/plus.svg" alt="" class="btn__icon">
        </button>
    </header>

    <div id="playlists-grid" class="playlists-list">
        <!-- Playlists will be injected here -->
    </div>
</div>

<!-- Create Playlist Modal -->
<div id="create-playlist-modal" class="modal">
    <div class="modal__dialog modal__dialog--sm">
        <h2 class="modal__title" data-i18n="playlists.create_new">Create New Playlist</h2>
        <div class="modal__body form-group">
            <input type="text" id="new-playlist-name" class="form-input focusable" placeholder="Playlist Name" data-i18n="playlists.namePlaceholder" maxlength="30">
        </div>
        <div class="modal__footer btn-group btn-group--fill">
            <button id="cancel-create-btn" class="btn btn--secondary focusable universal-onclick" type="button" data-i18n="common.cancel">Cancel</button>
            <button id="confirm-create-btn" class="btn btn--primary focusable universal-onclick" type="button" data-i18n="common.create">Create</button>
        </div>
    </div>
</div>
