<div class="playlists-container">
    <header class="page-header">
        <h1 class="page-title" data-i18n="playlists.title">My Playlists</h1>
        <button id="create-playlist-btn" class="btn btn--secondary focusable" data-i18n="playlists.create">
            <span class="icon">+</span> Create New
        </button>
    </header>

    <div id="playlists-grid" class="media-grid media-grid--widescreen playlists-grid">
        <!-- Playlists will be injected here -->
    </div>
</div>

<!-- Create Playlist Modal -->
<div id="create-playlist-modal" class="modal">
    <div class="modal__dialog modal__dialog--md">
        <h2 class="modal__title modal-title" data-i18n="playlists.create_new">Create New Playlist</h2>
        <div class="modal__body form-group">
            <input type="text" id="new-playlist-name" class="form-input focusable" placeholder="Playlist Name" data-i18n="playlists.namePlaceholder" maxlength="30">
        </div>
        <div class="modal__footer modal__footer--vertical btn-group btn-group--vertical">
            <button id="confirm-create-btn" class="btn btn--primary focusable" data-i18n="common.create">Create</button>
            <button id="cancel-create-btn" class="btn btn--secondary btn--sm focusable" data-i18n="common.cancel">Cancel</button>
        </div>
    </div>
</div>
