<div class="page-container">
    <div id="playlist-details-view" class="details-page">
        <!-- Cinematic Background backdrop -->
        <div class="media-backdrop playlist-backdrop" id="playlist-backdrop">
            <div class="media-backdrop__overlay backdrop-overlay"></div>
        </div>

        <div class="details-layout">
            <div class="details-top">
                <div class="details-info">
                    <h1 class="title-hero details-title" id="playlist-title">Playlist Name</h1>
                    <div class="details-genres">
                        <span id="playlist-count">0 items</span>
                        <span class="details-separator meta-separator-dot">•</span>
                        <span data-i18n="playlists.type_label">Playlist</span>
                    </div>
                    <p class="details-overview" id="playlist-desc" data-i18n="playlists.description_default">Your personal collection of favorite movies and shows.</p>
                    <div class="details-actions btn-group">
                        <button id="play-all-btn" class="btn btn--primary focusable play-icon-button" type="button">
                            <svg class="mobile-play-icon hidden" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <path d="M5 3L19 12L5 21V3Z" fill="#111111"></path>
                            </svg>
                            <span class="play-button-label" data-i18n="playlists.playAll">Play All</span>
                        </button>
                        <button id="edit-info-btn" class="btn btn--secondary focusable" data-i18n="playlists.editInfo">
                            Edit Info
                        </button>
                        <button id="back-btn" class="btn btn--secondary focusable" data-i18n="details.back">
                            Back
                        </button>
                        <button id="clear-playlist-btn" class="btn btn--danger focusable" data-i18n="playlists.clearHistory">
                            Clear History
                        </button>
                        <button id="delete-playlist-btn" class="btn btn--danger focusable" data-i18n="playlists.delete">
                            Delete Playlist
                        </button>
                    </div>
                </div>
                <div class="details-poster-container">
                    <img id="playlist-poster" class="details-hero-poster playlist-hero-cover" src="" alt="Backdrop">
                </div>
            </div>

            <div class="details-bottom">
                <div class="recommendations-section">
                    <h3 class="section-title" data-i18n="playlists.items">Playlist Items</h3>
                    <div id="playlist-items-container" class="episodes-list">
                        <!-- Items injected via JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmation-modal" class="modal modal--danger">
        <div class="modal__dialog modal__dialog--sm">
            <h2 class="modal__title" data-i18n="playlists.removeItemTitle">Remove Item</h2>
            <p class="modal__desc" data-i18n="playlists.removeItemMessage">Are you sure you want to remove this item from the playlist?</p>
            <div class="modal__footer modal__footer--vertical btn-group btn-group--vertical">
                <button id="modal-confirm-btn" class="btn btn--danger focusable" data-i18n="playlists.deleteItem">Remove</button>
                <button id="modal-cancel-btn" class="btn btn--secondary btn--sm focusable" data-i18n="playlists.cancel">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Edit Playlist Modal -->
    <div id="edit-playlist-modal" class="modal">
        <div class="modal__dialog modal__dialog--md">
            <h2 class="modal__title" data-i18n="playlists.editInfo">Edit Info</h2>
            <div class="modal__body">
                <input id="edit-playlist-name-input" class="form-input focusable" type="text" placeholder="Playlist Name" data-i18n="playlists.namePlaceholder">
            </div>
            <div class="modal__footer modal__footer--vertical btn-group btn-group--vertical">
                <button id="edit-playlist-confirm-btn" class="btn btn--secondary focusable" data-i18n="common.save">Save</button>
                <button id="edit-playlist-cancel-btn" class="btn btn--secondary btn--sm focusable" data-i18n="playlists.cancel">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Item Context Drawer Modal -->
    <div id="item-context-modal" class="modal">
        <div class="modal__dialog modal__dialog--sm">
            <h2 id="context-item-title" class="modal__title modal__title--truncate">Movie Title</h2>
            <div class="modal__footer modal__footer--vertical btn-group btn-group--vertical">
                <button id="context-play-btn" class="btn btn--primary focusable play-icon-button" type="button">
                    <svg class="mobile-play-icon hidden" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M5 3L19 12L5 21V3Z" fill="#111111"></path>
                    </svg>
                    <span class="play-button-label" data-i18n="player.play">Play Content</span>
                </button>
                <button id="context-details-btn" class="btn btn--secondary focusable" data-i18n="player.moreInfo">View Info Details</button>
                <button id="context-move-up-btn" class="btn btn--secondary focusable" data-i18n="playlists.moveUp">Move Item Up</button>
                <button id="context-move-down-btn" class="btn btn--secondary focusable" data-i18n="playlists.moveDown">Move Item Down</button>
                <button id="context-remove-btn" class="btn btn--danger focusable" data-i18n="playlists.removeFromPlaylist">Remove from Playlist</button>
                <button id="context-cancel-btn" class="btn btn--secondary btn--sm focusable" data-i18n="playlists.cancel">Cancel</button>
            </div>
        </div>
    </div>
</div>
</body>
