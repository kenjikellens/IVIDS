<div class="page-container">
    <div id="playlist-details-view" class="playlists-container">
        <div class="page-header">
            <div class="tv-overlay-top">
                <div class="tv-controls-left">
                    <button id="back-btn" class="btn btn--secondary btn--circle-md focusable tv-back-btn universal-onclick" type="button" title="Back" aria-label="Back">
                        <img src="images/back.svg" alt="" class="btn__icon">
                    </button>
                    <div class="tv-info">
                        <h1 id="playlist-title">Playlist Name</h1>
                        <span id="playlist-count" class="tv-epg-info">0 items</span>
                    </div>
                </div>
                <button id="playlist-options-btn" class="btn btn--secondary btn--circle-md focusable tv-settings-btn universal-onclick" type="button" title="Options" aria-label="Options">
                    <img src="images/settings.svg" alt="" class="btn__icon">
                </button>
            </div>
        </div>

        <div class="playlist-items-section">
            <div id="playlist-items-container" class="episodes-list">
                <!-- Items injected via JS -->
            </div>
        </div>
    </div>

    <!-- Right-Edge Playlist Options Sidebar reusing Player Options classes -->
    <aside id="playlist-options-panel" class="tv-settings-panel hidden">
        <button id="playlist-options-close" type="button" class="tv-settings-header focusable universal-onclick">
            <img src="images/back.svg" alt="" class="btn__icon">
            <span id="playlist-options-title" class="tv-settings-title" data-i18n="playlists.options">Options</span>
        </button>
        <div id="playlist-options-list" class="tv-settings-options">
            <button id="play-all-btn" type="button" class="tv-opt-btn focusable universal-onclick">
                <span class="tv-opt-label" data-i18n="playlists.playAll">Play All</span>
                <span class="tv-opt-chevron">&rsaquo;</span>
            </button>
            <button id="edit-info-btn" type="button" class="tv-opt-btn focusable universal-onclick">
                <span class="tv-opt-label" data-i18n="playlists.editInfo">Edit Info</span>
                <span class="tv-opt-chevron">&rsaquo;</span>
            </button>
            <button id="clear-playlist-btn" type="button" class="tv-opt-btn focusable universal-onclick hidden">
                <span class="tv-opt-label" data-i18n="playlists.clearHistory">Clear History</span>
                <span class="tv-opt-chevron">&rsaquo;</span>
            </button>
            <button id="delete-playlist-btn" type="button" class="tv-opt-btn focusable universal-onclick">
                <span class="tv-opt-label" data-i18n="playlists.delete">Delete Playlist</span>
                <span class="tv-opt-chevron">&rsaquo;</span>
            </button>
            <div id="playlist-options-empty" class="tv-opt-btn hidden">
                <span class="tv-opt-label" data-i18n="playlists.emptyPlaylist">This playlist is empty.</span>
            </div>
        </div>
        <div id="playlist-options-submenu" class="tv-settings-options hidden"></div>
    </aside>

    <!-- Confirmation Modal -->
    <div id="confirmation-modal" class="modal modal--danger">
        <div class="modal__dialog modal__dialog--sm">
            <h2 class="modal__title" data-i18n="playlists.removeItemTitle">Remove Item</h2>
            <p class="modal__desc" data-i18n="playlists.removeItemMessage">Are you sure you want to remove this item from the playlist?</p>
            <div class="modal__footer modal__footer--vertical btn-group btn-group--vertical">
                <button id="modal-confirm-btn" class="btn btn--danger focusable universal-onclick" data-i18n="playlists.deleteItem">Remove</button>
                <button id="modal-cancel-btn" class="btn btn--secondary btn--sm focusable universal-onclick" data-i18n="playlists.cancel">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Edit Playlist Modal -->
    <div id="edit-playlist-modal" class="modal">
        <div class="modal__dialog modal__dialog--md">
            <h2 class="modal__title" data-i18n="playlists.editInfo">Edit Info</h2>
            <div class="modal__body">
                <input id="edit-playlist-name-input" class="form-input focusable" type="text" placeholder="Playlist Name" data-i18n="playlists.namePlaceholder">
            </div>
            <div class="modal__footer modal__footer--vertical btn-group btn-group--vertical">
                <button id="edit-playlist-confirm-btn" class="btn btn--secondary focusable universal-onclick" data-i18n="common.save">Save</button>
                <button id="edit-playlist-cancel-btn" class="btn btn--secondary btn--sm focusable universal-onclick" data-i18n="playlists.cancel">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Item Context Modal matching Player Stream Options styling on Mobile -->
    <div id="item-context-modal" class="modal">
        <div class="modal__dialog modal__dialog--md">
            <button id="context-back-btn" type="button" class="modal__back-btn btn btn--ghost btn--circle edit-trigger focusable universal-onclick" aria-label="Back">
                <img src="images/back.svg" class="modal-back-icon" alt="Back">
            </button>
            <h2 id="context-item-title" class="modal__title modal__title--truncate">Movie Title</h2>
            <div class="modal__body modal__body--scroll">
                <div class="settings-container">
                    <button id="context-play-btn" class="setting-item focusable universal-onclick" type="button">
                        <span class="setting-info"><span class="setting-label" data-i18n="player.play">Play Content</span></span>
                        <span class="setting-control"><span class="edit-trigger" aria-hidden="true"></span></span>
                    </button>
                    <button id="context-details-btn" class="setting-item focusable universal-onclick" type="button">
                        <span class="setting-info"><span class="setting-label" data-i18n="player.moreInfo">View Info Details</span></span>
                        <span class="setting-control"><span class="edit-trigger" aria-hidden="true"></span></span>
                    </button>
                    <button id="context-move-up-btn" class="setting-item focusable universal-onclick" type="button">
                        <span class="setting-info"><span class="setting-label" data-i18n="playlists.moveUp">Move Item Up</span></span>
                        <span class="setting-control"><span class="edit-trigger" aria-hidden="true"></span></span>
                    </button>
                    <button id="context-move-down-btn" class="setting-item focusable universal-onclick" type="button">
                        <span class="setting-info"><span class="setting-label" data-i18n="playlists.moveDown">Move Item Down</span></span>
                        <span class="setting-control"><span class="edit-trigger" aria-hidden="true"></span></span>
                    </button>
                    <button id="context-add-to-playlist-btn" class="setting-item focusable universal-onclick" type="button">
                        <span class="setting-info"><span class="setting-label" data-i18n="playlists.addToOtherPlaylist">Add to Another Playlist</span></span>
                        <span class="setting-control"><span class="edit-trigger" aria-hidden="true"></span></span>
                    </button>
                    <button id="context-remove-btn" class="setting-item setting-item--danger focusable universal-onclick" type="button">
                        <span class="setting-info"><span class="setting-label" data-i18n="playlists.removeFromPlaylist">Remove from Playlist</span></span>
                        <span class="setting-control"><span class="edit-trigger" aria-hidden="true"></span></span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Add to Another Playlist Modal matching Player Stream Options styling -->
    <div id="add-to-other-playlist-modal" class="modal">
        <div class="modal__dialog modal__dialog--md">
            <button id="other-playlist-back-btn" type="button" class="modal__back-btn btn btn--ghost btn--circle edit-trigger focusable universal-onclick" aria-label="Back">
                <img src="images/back.svg" class="modal-back-icon" alt="Back">
            </button>
            <h2 class="modal__title" data-i18n="playlists.addToOtherPlaylist">Add to Another Playlist</h2>
            <div class="modal__body modal__body--scroll">
                <div id="other-playlist-selection-list" class="settings-container playlist-selection-list"></div>
            </div>
        </div>
    </div>
</div>
</body>
