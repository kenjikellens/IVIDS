<header class="hero" id="hero">
    <div id="hero-loader-container" class="loader-center-container">
        <div class="ivids-loader"></div>
    </div>
    <div class="hero-content">
        <h1 class="hero-title" id="hero-title"></h1>
        <p class="hero-desc" id="hero-desc"></p>
        <div class="hero-buttons btn-group">
            <button class="btn btn--primary focusable" id="play-btn" data-i18n="player.play">Play</button>
        </div>
    </div>
</header>

<!-- Recently watched row (populated dynamically if history exists) -->
<div class="row hidden" id="recently-watched-container">
    <h2 class="row-title" data-i18n="nav.recently_watched">Recently Watched</h2>
    <div class="row-posters" id="recently-watched-row"></div>
</div>

<!-- Dynamic host container for category rows rendered via CategoryRenderer -->
<div id="home-rows-container"></div>
