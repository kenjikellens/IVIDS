<div class="video-container" id="video-container">
    <div class="player-container">
        <div id="video-player" class="full-size"></div>
        <video id="native-video-player" class="hidden" playsinline></video>

        <!-- Minimal Live TV-Style Overlay -->
        <div id="player-hud" class="tv-overlay">
            <!-- Top Bar: Back left, Title center, Settings right -->
            <div class="tv-overlay-top">
                <button class="btn btn--secondary btn--circle-md focusable tv-back-btn universal-onclick" id="player-back" type="button" aria-label="Back">
                    <img src="images/back.svg" alt="" class="btn__icon">
                </button>
                <div class="vod-title" id="player-title"></div>
                <button class="btn btn--secondary btn--circle-md focusable tv-settings-btn universal-onclick" id="player-settings" type="button" aria-label="Settings">
                    <img src="images/settings.svg" alt="" class="btn__icon">
                </button>
            </div>

            <!-- Right-Edge 2-Level Settings Sidebar (Quality, Subtitles, Server Settings) -->
            <aside id="player-settings-panel" class="tv-settings-panel hidden">
                <button id="player-settings-back" type="button" class="tv-settings-header focusable universal-onclick">
                    <img src="images/back.svg" alt="" class="btn__icon">
                    <span id="player-settings-title" class="tv-settings-title" data-i18n="livetv.streamOptions">Stream Options</span>
                </button>
                <div id="player-settings-options" class="tv-settings-options"></div>
            </aside>

            <!-- Minimal Bottom Controls: Thin Scrub Bar + Only -30s, -10s, Play/Pause, +10s, +30s -->
            <div class="vod-overlay-bottom" id="vod-overlay-bottom">
                <div class="vod-scrub-row" id="hud-scrub-bar-container">
                    <div class="progress-bar focusable epg-progress-bar-container" id="player-progress-bar" tabindex="-1" role="slider" aria-label="Playback progress">
                        <div class="progress-bar-fill epg-progress-bar-fill" id="player-progress-fill"></div>
                    </div>
                    <div class="vod-time-display">
                        <span id="player-current-time">00:00</span> / <span id="player-duration">00:00</span>
                    </div>
                </div>

                <div class="vod-transport-bar" id="hud-control-bar">
                    <button class="vod-skip-btn focusable universal-onclick" id="player-rewind-30" type="button" aria-label="Rewind 30 seconds">
                        <img src="images/replay-30.svg" alt="-30s" class="btn__icon">
                    </button>
                    <button class="vod-skip-btn focusable universal-onclick" id="player-rewind-10" type="button" aria-label="Rewind 10 seconds">
                        <img src="images/replay-10.svg" alt="-10s" class="btn__icon">
                    </button>
                    <button class="btn btn--primary vod-play-btn focusable universal-onclick" id="play-pause-btn" type="button" aria-label="Play or Pause">
                        <img src="images/pause.svg" alt="" id="player-icon-pause" class="btn__icon">
                        <img src="images/play.svg" alt="" id="player-icon-play" class="btn__icon hidden">
                    </button>
                    <button class="vod-skip-btn focusable universal-onclick" id="player-forward-10" type="button" aria-label="Forward 10 seconds">
                        <img src="images/forward-10.svg" alt="+10s" class="btn__icon">
                    </button>
                    <button class="vod-skip-btn focusable universal-onclick" id="player-forward-30" type="button" aria-label="Forward 30 seconds">
                        <img src="images/forward-30.svg" alt="+30s" class="btn__icon">
                    </button>
                </div>
            </div>
        </div>

        <!-- Loading Spinner Overlay -->
        <div id="player-loading-overlay" class="player-loading-overlay">
            <div class="ivids-loader"></div>
            <span class="player-loading-text" data-i18n="player.loading">Loading...</span>
            <span id="player-loading-source" class="player-loading-source hidden"></span>
        </div>

        <!-- Status / Fallback Notice Panel -->
        <div id="player-status-panel" class="player-status-panel hidden">
            <h2 id="player-status-title" data-i18n="player.statusTitle">Player is taking too long</h2>
            <p id="player-status-message" data-i18n="player.statusMessage">The configured player provider did not respond yet. You can go back or change the player endpoint in Settings.</p>
            <div class="player-status-actions btn-group">
                <button id="player-status-back" class="btn btn--secondary focusable universal-onclick" type="button" data-i18n="details.back">Back</button>
                <button id="player-status-settings" class="btn btn--primary focusable universal-onclick" type="button" data-i18n="nav.settings">Settings</button>
            </div>
        </div>
    </div>
</div>
