<div class="browse-container">
    <!-- Hero Banner Section matching Home & Movies pages -->
    <div class="hero">
        <div class="hero-content">
            <h1 class="hero-title" data-i18n="livesports.title">Live Sports</h1>
            <p class="hero-desc" data-i18n="livesports.subtitle">Watch live football matches, Ligue 1, Premier League, Champions League & Formula 1</p>
        </div>
    </div>

    <!-- Dynamic Category Rows Container matching Home/Movies/Series -->
    <div id="livesports-rows-container">
        <!-- Dynamically injected competition rows (.row-container) -->
    </div>

    <!-- Empty State Component matching IVIDS Design System -->
    <div id="livesports-empty-state" class="empty-state hidden">
        <p data-i18n="livesports.noMatches">No live matches scheduled right now. Check back near match kickoff!</p>
    </div>
</div>
