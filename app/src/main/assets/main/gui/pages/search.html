<div class="search-page-layout">
    <div class="search-main">
        <div class="search-container-wrapper">
            <div id="recent-searches-row" class="recent-searches-row hidden">
                <span class="recent-label" data-i18n="search.recent">Recent:</span>
                <button id="clear-recents-btn" class="focusable clear-recents-btn" title="Clear Recents">
                    <img src="images/trash.svg" class="trash-icon" alt="Clear">
                    <span data-i18n="search.clearRecents">Clear</span>
                </button>
                <div id="recent-list" class="recent-list">
                    <!-- Recent items -->
                </div>
            </div>

            <div class="search-box">
                <div class="form-control-wrapper focusable-container">
                    <img src="images/search.svg" class="search-icon" alt="Search">
                    <input type="text" id="search-input" class="form-input focusable" placeholder="Search for movies or series..."
                        data-i18n="search.placeholder" readonly>
                </div>
            </div>

            <div class="search-actions btn-group">
                <button id="search-btn" class="btn btn--primary focusable" title="Search">
                    <img src="images/search.svg" class="filter-icon" alt="Search">
                    <span data-i18n="search.button">Search</span>
                </button>
                <button id="filter-btn" class="btn btn--secondary focusable" title="Filters">
                    <img src="images/filter.svg" class="filter-icon" alt="Filters">
                    <span data-i18n="search.filters">Filters</span>
                </button>
            </div>
        </div>

        <div id="search-results-container" class="results-container">
            <div id="search-results" class="media-grid media-grid--posters search-results-grid">
                <!-- Results injected here -->
            </div>
            <div id="scroll-anchor"></div>
        </div>
    </div>

    <!-- Filter Modal (Replaces Sidebar) -->
    <div id="filter-modal" class="modal">
        <div class="modal__dialog modal__dialog--xl">
            <h2 class="modal__title modal-title" data-i18n="search.filters">Filters</h2>

            <div class="modal__body modal__body--scroll modal-scroll-area">
                <div class="filter-main-grid">
                    <!-- Row 1: Content Type & Year -->
                    <!-- Content Type -->
                    <div class="form-group">
                        <h3 data-i18n="search.type">Content Type</h3>
                        <div class="chip-grid chip-grid--2col">
                            <label class="chip chip--filter focusable" tabindex="0">
                                <input type="checkbox" name="media-type" value="movie" checked>
                                <span data-i18n="search.movies">Movies</span>
                            </label>
                            <label class="chip chip--filter focusable" tabindex="0">
                                <input type="checkbox" name="media-type" value="tv" checked>
                                <span data-i18n="search.series">Series</span>
                            </label>
                        </div>
                    </div>

                    <!-- Year -->
                    <div class="form-group">
                        <h3 data-i18n="search.year">Year</h3>
                        <input type="number" id="year-filter" class="form-input focusable" placeholder="e.g. 2024"
                            data-i18n="search.year" min="1900" max="2100" readonly>
                    </div>

                    <!-- Row 2: Sort & Country -->
                    <div class="form-group">
                        <h3 data-i18n="search.sortBy">Sort By</h3>
                        <button id="sort-by-btn" class="form-select-trigger focusable">
                            <span id="sort-by-label" data-i18n="search.popularity">Popularity</span>
                            <span class="icon">❯</span>
                        </button>
                    </div>

                    <div class="form-group">
                        <h3 data-i18n="search.country">Production Country</h3>
                        <button id="country-select-btn" class="form-select-trigger focusable">
                            <span id="country-label" data-i18n="search.allCountries">All Countries</span>
                            <span class="icon">❯</span>
                        </button>
                    </div>
                </div>

                <!-- Full Width Sections -->
                <div class="form-group">
                    <div class="group-header">
                        <h3 data-i18n="search.genres">Genres</h3>
                        <span id="genre-count" class="badge"></span>
                    </div>
                    <button id="genre-select-btn" class="form-select-trigger focusable">
                        <span data-i18n="search.selectGenres">Select Genres</span>
                        <span class="icon">❯</span>
                    </button>
                </div>

                <!-- Age Rating -->
                <div class="form-group">
                    <h3 data-i18n="search.rating">Age Rating</h3>
                    <div id="cert-filters" class="chip-grid chip-grid--3col">
                        <!-- Certs injected here -->
                    </div>
                </div>
            </div>

            <div class="modal__footer modal__footer--vertical btn-group btn-group--vertical">
                <button id="close-filters-btn" class="btn btn--primary focusable" data-i18n="search.apply">Apply</button>
                <button id="clear-filters-btn" class="btn btn--danger focusable" data-i18n="search.clearFilters">Clear All</button>
                <button id="cancel-filters-btn" class="btn btn--secondary btn--sm focusable" data-i18n="search.cancel">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Genre Selection Modal -->
    <div id="genre-modal" class="modal">
        <div class="modal__dialog modal__dialog--md">
            <h2 class="modal__title modal-title" data-i18n="search.genres">Select Genres</h2>
            <div id="genre-filters" class="modal__body chip-grid chip-grid--3col">
                <!-- Genres injected here -->
            </div>
            <div class="modal__footer modal-actions btn-group btn-group--fill">
                <button id="genre-done-btn" class="btn btn--secondary focusable" data-i18n="search.done">Done</button>
            </div>
        </div>
    </div>

    <!-- Custom Select Modals -->
    <div id="sort-modal" class="modal">
        <div class="modal__dialog modal__dialog--sm">
            <h2 class="modal__title modal-title" data-i18n="search.sortBy">Sort By</h2>
            <div class="modal__body select-options-list" id="sort-options-list">
                <div class="chip chip--option focusable" data-value="popularity.desc" data-i18n="search.popularity">Popularity
                </div>
                <div class="chip chip--option focusable" data-value="vote_average.desc" data-i18n="search.topRated">Top Rated
                </div>
                <div class="chip chip--option focusable" data-value="primary_release_date.desc" data-i18n="search.newest">
                    Newest</div>
                <div class="chip chip--option focusable" data-value="vote_count.desc" data-i18n="search.mostVoted">Most Voted
                </div>
            </div>
            <div class="modal__footer modal__footer--vertical btn-group btn-group--vertical">
                <button id="sort-confirm-btn" class="btn btn--secondary focusable" data-i18n="search.confirm">Confirm</button>
                <button id="sort-cancel-btn" class="btn btn--secondary btn--sm focusable" data-i18n="search.cancel">Cancel</button>
            </div>
        </div>
    </div>

    <div id="country-modal" class="modal">
        <div class="modal__dialog modal__dialog--xl">
            <h2 class="modal__title modal-title" data-i18n="search.country">Production Country</h2>
            <div class="modal__search modal-search-wrapper">
                <input type="text" id="country-search-input" class="form-input form-input--compact focusable"
                    placeholder="Search countries..." data-i18n="search.searchCountries" readonly>
            </div>
            <div id="country-options-list" class="modal__body modal__body--scroll chip-grid chip-grid--3col scrollable">
                <!-- Countries injected here -->
            </div>
        </div>
    </div>
</div>
