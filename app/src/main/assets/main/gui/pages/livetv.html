<div class="livetv-page-layout">
    <!-- Top Area: Search and Compact Actions -->
    <div class="top-bar livetv-top-bar">
        <div class="search-box">
            <div class="form-control-wrapper focusable-container">
                <img src="images/search.svg" class="search-icon" alt="Search">
                <input type="text" id="search-input" class="form-input focusable" placeholder="Search for channels..."
                    data-i18n="livetv.searchPlaceholder" readonly>
                <button id="search-clear" class="search-clear-btn focusable hidden" aria-label="Clear Search">&times;</button>
            </div>
        </div>

        <div class="top-bar__actions livetv-top-actions btn-group">
            <button id="livetv-filter-btn" class="btn btn--secondary focusable" title="Filters">
                <img src="images/filter.svg" class="filter-icon" alt="Filters">
                <span data-i18n="livetv.filters">Filters</span>
                <span id="active-filter-badge" class="badge badge--primary hidden">0</span>
            </button>
        </div>
    </div>

    <!-- Quick Filter Pills Row -->
    <div class="livetv-quick-filters-row">
        <div class="livetv-quick-filters chip-grid" id="livetv-quick-filters">
            <button id="pill-all" class="chip chip--filter focusable active" data-filter="all">
                <span data-i18n="livetv.all">All</span>
            </button>
            <button id="pill-sports" class="chip chip--filter focusable" data-filter="sports">
                <img src="images/sports.svg" class="chip__icon" alt="Sports">
                <span data-i18n="livetv.sportsFilter">Voetbal / Live Sports</span>
            </button>
            <button id="pill-favorites" class="chip chip--filter focusable" data-filter="favorites">
                <img src="images/star.svg" class="chip__icon" alt="Favorites">
                <span data-i18n="livetv.favorites">Favorites</span>
            </button>
        </div>
    </div>

    <!-- Two-Column Layout Body -->
    <div class="livetv-two-column-layout">
        <!-- Left Column: Scrollable list of channels -->
        <div class="livetv-list-column">
            <div class="channels-list" id="channels-list">
                <!-- Dynamically injected wide rectangular rows -->
            </div>

            <div id="no-channels-message" class="empty-state hidden">
                <p data-i18n="livetv.noChannels">No channels found</p>
            </div>
        </div>

        <!-- Right Column: Channel Preview & EPG details -->
        <div class="livetv-preview-column">
            <!-- Default Placeholder when no channel is focused -->
            <div id="hero-placeholder" class="hero-placeholder-content">
                <div class="placeholder-icon-large"></div>
                <h1 data-i18n="livetv.title">Live TV</h1>
                <p data-i18n="livetv.selectSubtitle">Discover and watch hundreds of live channels</p>
            </div>

            <!-- Active Channel Details -->
            <div id="hero-active-content" class="hero-active-content hidden">
                <!-- Top Card: 16:9 Widescreen Video Preview -->
                <div class="card card--panel card--widescreen preview-card preview-card-video">
                    <div class="preview-card__video-wrap">
                        <video id="livetv-preview-video" autoplay muted playsinline></video>
                        <div id="preview-video-loading" class="preview-video-loading hidden">
                            <div class="ivids-loader"></div>
                        </div>
                        <div class="preview-card__overlay">
                            <div class="preview-card__header">
                                <div class="preview-card__meta">
                                    <span id="preview-channel-badge" class="badge badge--glass preview-card__badge">LIVE</span>
                                    <h2 id="preview-channel-name" class="preview-card__title">Channel Name</h2>
                                    <span id="preview-channel-group" class="preview-card__group">Category</span>
                                </div>
                            </div>
                            <div class="preview-card__actions btn-group">
                                <button id="preview-watch-btn" class="btn btn--primary focusable" title="Watch Fullscreen">
                                    <img src="images/play.svg" class="btn__icon" alt="Play">
                                    <span data-i18n="livetv.watchFullscreen">Watch Fullscreen</span>
                                </button>
                                <button id="preview-fav-btn" class="btn btn--secondary focusable" title="Toggle Favorite">
                                    <img id="preview-fav-icon" src="images/star.svg" class="btn__icon" alt="Favorite">
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Bottom Card: Current & Upcoming Program EPG Schedules -->
                <div class="card card--panel epg-panel epg-card">
                    <!-- Current Program Schedule -->
                    <div id="hero-epg-container" class="details-epg-section hidden">
                        <h3 class="section-title">
                            <span class="live-badge" data-i18n="livetv.live">LIVE</span>
                            <span data-i18n="livetv.playingNow">Playing Now</span>
                        </h3>
                        <div class="epg-active-show">
                            <span id="hero-epg-title" class="epg-show-title"></span>
                            <div class="hero-epg-progress-wrapper">
                                <span id="hero-epg-start" class="epg-time"></span>
                                <div class="epg-progress-bar-container">
                                    <div id="hero-epg-progress" class="epg-progress-bar-fill"></div>
                                </div>
                                <span id="hero-epg-end" class="epg-time"></span>
                            </div>
                        </div>
                    </div>

                    <!-- Upcoming Programs list -->
                    <div class="details-upcoming-section">
                        <h3 class="section-title" data-i18n="livetv.upcoming">Upcoming Programs</h3>
                        <div class="upcoming-programs-list" id="upcoming-programs-list">
                            <!-- Injected upcoming show rows -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modern Filter Modal -->
    <div id="livetv-filter-modal" class="modal">
        <div class="modal__dialog modal__dialog--xl">
            <h2 class="modal__title" data-i18n="livetv.filterDialog">Filter Channels</h2>

            <div class="modal__body modal__body--scroll">
                <!-- Genre Section -->
                <div class="form-group">
                    <div class="group-header">
                        <h3 data-i18n="livetv.genre">Genre</h3>
                        <span id="genre-filter-count" class="badge"></span>
                    </div>
                    <div id="filter-genre-chips" class="chip-grid chip-grid--3col">
                        <!-- Genre chips injected dynamically -->
                    </div>
                </div>

                <!-- Country Section -->
                <div class="form-group">
                    <div class="group-header">
                        <h3 data-i18n="livetv.country">Country</h3>
                        <span id="country-filter-count" class="badge"></span>
                    </div>
                    <div id="filter-country-chips" class="chip-grid chip-grid--3col">
                        <!-- Country chips injected dynamically -->
                    </div>
                </div>
            </div>

            <div class="modal__footer modal__footer--vertical btn-group btn-group--vertical">
                <button id="filter-apply-btn" class="btn btn--primary focusable" data-i18n="livetv.apply">Apply</button>
                <button id="filter-clear-btn" class="btn btn--danger focusable" data-i18n="livetv.clearFilters">Clear All</button>
                <button id="filter-cancel-btn" class="btn btn--secondary focusable" data-i18n="livetv.cancel">Cancel</button>
            </div>
        </div>
    </div>
</div>
