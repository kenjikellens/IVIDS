<div class="livetv-page-layout">
    <!-- Three-Column IPTV Body: [Categories / Countries List] | [Search + Channels List] | [Video Preview & EPG] -->
    <div class="livetv-two-column-layout">
        <!-- Left Column: Vertical Scrollable List of Categories & Countries -->
        <div class="livetv-categories-column">
            <div class="categories-list" id="categories-list">
                <!-- Dynamically injected focusable category & country rows -->
            </div>
        </div>

        <!-- Middle Column: Search Bar + Scrollable list of channels -->
        <div class="livetv-list-column">
            <div class="search-box livetv-search-box">
                <div class="form-control-wrapper focusable-container">
                    <img src="images/search.svg" class="search-icon" alt="Search">
                    <input type="text" id="search-input" class="form-input focusable" placeholder="Search for channels..."
                        data-i18n="livetv.searchPlaceholder" aria-label="Search for channels" readonly>
                    <button id="search-clear" class="search-clear-btn focusable hidden universal-onclick" aria-label="Clear Search">&times;</button>
                </div>
            </div>

            <div class="channels-list" id="channels-list">
                <!-- Dynamically injected clean channel rows -->
            </div>

            <div id="no-channels-message" class="empty-state hidden">
                <p data-i18n="livetv.noChannels">No channels found</p>
                <button id="livetv-open-settings-btn" type="button" class="btn btn--primary focusable universal-onclick" data-i18n="nav.settings">Open Settings</button>
            </div>
        </div>

        <!-- Right Column: Channel Preview & EPG details (Consistent Structure from Initial Load) -->
        <div class="livetv-preview-column">
            <div id="hero-active-content" class="hero-active-content">
                <!-- Top Card: 16:9 Widescreen Video Preview -->
                <div class="preview-card preview-card-video focusable" id="livetv-preview-card" role="button" tabindex="0">
                    <video id="livetv-preview-video" autoplay muted playsinline></video>
                    <div id="preview-offline-message" class="preview-offline-message hidden" data-i18n="livetv.previewUnavailable"></div>
                    <div id="preview-video-loading" class="preview-video-loading hidden">
                        <div class="ivids-loader"></div>
                    </div>
                </div>

                <!-- Bottom Card: Channel Name & Clean EPG Schedule -->
                <div class="card card--panel epg-panel epg-card">
                    <h2 id="preview-channel-name" class="preview-channel-title" data-i18n="livetv.selectChannel"></h2>
                    <div id="hero-epg-container" class="details-epg-section">
                        <div class="epg-header-row">
                            <span id="hero-epg-title" class="epg-show-title" data-i18n="livetv.noEpgInfo">No program info available</span>
                            <span id="hero-epg-time" class="epg-time hidden"></span>
                        </div>
                        <div id="hero-epg-progress-wrap" class="epg-progress-bar-container hidden">
                            <div id="hero-epg-progress" class="epg-progress-bar-fill"></div>
                        </div>
                    </div>

                    <!-- Upcoming Programs list (shown only when data exists) -->
                    <div id="details-upcoming-section" class="details-upcoming-section hidden">
                        <div class="upcoming-programs-list" id="upcoming-programs-list">
                            <!-- Injected upcoming show rows -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
