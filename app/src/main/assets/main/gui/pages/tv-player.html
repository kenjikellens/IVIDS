<div class="tv-player-container">
    <!-- Clean video stream without native browser controls -->
    <video id="tv-video" class="tv-video" autoplay></video>

    <!-- Zapping HUD Overlay (Top Right, temporary indicator) -->
    <div id="tv-zapping-hud" class="tv-zapping-hud hidden">
        <span class="zapping-label" data-i18n="livetv.zappingTo">Zapping to...</span>
        <span id="zapping-channel-name" class="zapping-channel-name">Channel Name</span>
    </div>

    <!-- Custom Player Overlay (Auto Hides) -->
    <div class="tv-overlay" id="tv-overlay">
        <div class="tv-overlay-top">
            <button class="btn btn--secondary btn--circle-xl focusable" id="tv-back" title="Back">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
            </button>
        </div>

        <div class="tv-overlay-bottom">
            <div class="tv-controls-left">
                <!-- Play/Pause Toggle -->
                <button class="btn btn--primary btn--circle-xl play-pause-btn focusable" id="tv-play-pause" title="Play/Pause">
                    <!-- Pause Icon (default since it autoplays) -->
                    <svg id="icon-pause" viewBox="0 0 24 24" fill="currentColor" width="28" height="28">
                        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                    </svg>
                    <!-- Play Icon -->
                    <svg id="icon-play" viewBox="0 0 24 24" fill="currentColor" width="28" height="28" class="hidden">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                </button>

                <!-- Channel Metadata -->
                <div class="tv-info">
                    <h1 id="tv-title">Channel Name</h1>
                    <div class="tv-meta-row">
                        <span id="tv-group" class="tv-group-badge">Group Name</span>
                        <span class="tv-epg-info" id="tv-epg" data-i18n="livetv.epgNoInfo">No Program Info</span>
                    </div>
                </div>
            </div>

            <div class="tv-controls-right">
                <div class="btn-group tv-extra-controls">
                    <!-- Aspect Ratio Switcher -->
                    <button class="btn btn--secondary btn--circle-md focusable" id="tv-aspect-ratio" title="Aspect Ratio">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="2" y="7" width="20" height="15" rx="2" ry="2"/>
                            <polyline points="17 2 12 7 7 2"/>
                        </svg>
                    </button>
                    <!-- Quick Channel Guide / EPG Trigger -->
                    <button class="btn btn--secondary btn--circle-md focusable" id="tv-epg-btn" title="Channel Guide">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="8" y1="6" x2="21" y2="6"/>
                            <line x1="8" y1="12" x2="21" y2="12"/>
                            <line x1="8" y1="18" x2="21" y2="18"/>
                            <line x1="3" y1="6" x2="3.01" y2="6"/>
                            <line x1="3" y1="12" x2="3.01" y2="12"/>
                            <line x1="3" y1="18" x2="3.01" y2="18"/>
                        </svg>
                    </button>
                </div>

                <!-- Channel Zap Guide Indicators -->
                <div class="tv-zap-guide">
                    <span class="guide-key">▲/▼</span>
                    <span class="guide-label" data-i18n="livetv.zapChannel">Zap Channel</span>
                </div>
                <div class="tv-status-badge">
                    <span class="status-dot online"></span>
                    <span class="tv-quality-badge">LIVE HD</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Quick EPG / Channel Guide Modal Overlay -->
    <div class="modal tv-quick-epg" id="tv-quick-epg" style="display: none;">
        <div class="modal__dialog modal__dialog--md">
            <div class="modal__header">
                <h3 class="modal__title" data-i18n="livetv.title">Live TV Guide</h3>
                <button class="btn modal__close focusable" id="tv-epg-close" aria-label="Close">&times;</button>
            </div>
            <div class="modal__body modal__body--scroll" id="tv-quick-epg-list">
                <!-- Dynamically populated focusable channel list items -->
            </div>
        </div>
    </div>

    <!-- Buffering/Loading Indicator -->
    <div id="tv-loading" class="tv-loading">
        <div class="ivids-loader"></div>
    </div>
</div>
