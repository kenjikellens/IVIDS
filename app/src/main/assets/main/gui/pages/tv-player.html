<div class="tv-player-container tv-player-page">
    <!-- Clean video stream without native browser controls -->
    <video id="tv-video" class="tv-video" autoplay></video>

    <!-- Zapping HUD Overlay (Top Right, compact temporary indicator) -->
    <div id="tv-zapping-hud" class="tv-zapping-hud hidden">
        <span id="zapping-channel-name" class="zapping-channel-name"></span>
    </div>

    <!-- Custom Player Overlay (Auto Hides) -->
    <div class="tv-overlay" id="tv-overlay">
        <div class="tv-overlay-top tv-top-bar">
            <button class="btn btn--secondary btn--circle-md focusable tv-back-btn universal-onclick" id="tv-back" type="button" aria-label="Back" title="Back">
                <img src="images/back.svg" alt="" class="btn__icon">
            </button>
            <button class="btn btn--secondary btn--circle-md focusable tv-settings-btn universal-onclick" id="tv-settings-btn" type="button" aria-label="Settings" title="Settings">
                <img src="images/settings.svg" alt="" class="btn__icon">
            </button>
        </div>

        <!-- Minimal Right-Edge 2-Level Stream Options Sidebar -->
        <aside id="tv-settings-panel" class="tv-settings-panel hidden">
            <button id="tv-settings-back" type="button" class="tv-settings-header focusable universal-onclick">
                <img src="images/back.svg" alt="" class="btn__icon">
                <span id="tv-settings-title" class="tv-settings-title" data-i18n="livetv.streamOptions"></span>
            </button>
            <div id="tv-settings-options" class="tv-settings-options"></div>
        </aside>

        <!-- Minimal Inline Offline Retry Fallback -->
        <div id="tv-offline-fallback" class="tv-offline-fallback hidden">
            <button class="btn btn--secondary btn--sm tv-retry-btn focusable universal-onclick" id="tv-retry-btn" type="button" data-i18n="livetv.retry"></button>
        </div>

        <!-- Strictly Channel Icon + Channel Name + Optional Program Name -->
        <div class="tv-overlay-bottom tv-bottom-bar">
            <div class="tv-controls-left">
                <div class="tv-channel-avatar">
                    <img id="tv-channel-logo" class="tv-channel-logo" src="images/livetv.svg" alt="">
                </div>
                <div class="tv-info">
                    <h1 id="tv-title"></h1>
                    <span class="tv-epg-info hidden" id="tv-epg"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Buffering/Loading Indicator -->
    <div id="tv-loading" class="tv-loading hidden">
        <div class="ivids-loader"></div>
    </div>
</div>
